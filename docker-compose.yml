# =============================================================================
# Unified Docker Compose for Local Development
# =============================================================================
# Usage:
#   docker compose up -d                    # Start core services (postgres, redis, mail)
#   docker compose --profile admin up -d    # Include pgAdmin & RedisInsight
#   docker compose --profile s3 up -d       # Include RustFS (S3-compatible storage)
#   docker compose --profile full up -d     # Start everything
#   docker compose --profile test up -d     # Start test database
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 18 with extensions (custom build)
  # Rebuild after adding extensions: docker compose build postgres
  # ---------------------------------------------------------------------------
  postgres:
    build:
      context: ./docker
      dockerfile: Dockerfile.postgres
    container_name: dev_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dev}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      # PG18+ requires mount at /var/lib/postgresql (not /data subdirectory)
      - ./data/postgres:/var/lib/postgresql
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dev-network

  # ---------------------------------------------------------------------------
  # Redis 7 with persistence
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: dev_redis
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - ./data/redis:/data
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dev-network

  # ---------------------------------------------------------------------------
  # Mailpit - Email Testing (SMTP: 1025, Web UI: 8025)
  # Replaces MailHog with native ARM64 support
  # ---------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: dev_mailpit
    ports:
      - '${MAIL_SMTP_PORT:-1025}:1025'
      - '${MAIL_UI_PORT:-8025}:8025'
    restart: unless-stopped
    networks:
      - dev-network

  # ---------------------------------------------------------------------------
  # pgAdmin 4 - PostgreSQL Management
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dev_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - '${PGADMIN_PORT:-5050}:80'
    volumes:
      - ./data/pgadmin:/var/lib/pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dev-network
    profiles:
      - admin
      - full

  # ---------------------------------------------------------------------------
  # RedisInsight - Redis Management
  # ---------------------------------------------------------------------------
  redis-insight:
    image: redis/redisinsight:latest
    container_name: dev_redis_insight
    ports:
      - '${REDIS_INSIGHT_PORT:-5540}:5540'
    volumes:
      - ./data/redis_insight:/data
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - dev-network
    profiles:
      - admin
      - full

  # ---------------------------------------------------------------------------
  # RustFS - S3-compatible Object Storage
  # One shared instance for all local projects; one bucket per project.
  # ---------------------------------------------------------------------------
  rustfs:
    image: rustfs/rustfs:latest
    container_name: dev_rustfs
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_ADDRESS: '0.0.0.0:9000'
      RUSTFS_CONSOLE_ADDRESS: '0.0.0.0:9001'
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      # Dev infrastructure: bound to loopback so it is not exposed on the LAN
      - '127.0.0.1:${RUSTFS_API_PORT:-9000}:9000'
      - '127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001'
    volumes:
      # Image default is RUSTFS_VOLUMES=/data (single drive, fine for dev)
      - ./data/rustfs:/data
    # The image runs as uid 10001, which cannot write a root-owned bind mount.
    # Running as root keeps ./data/rustfs usable without a permission-fixer
    # sidecar; this is local development infrastructure only.
    user: '0:0'
    restart: unless-stopped
    healthcheck:
      # S3 API health + console health (RustFS's unauthenticated probes)
      test:
        [
          'CMD-SHELL',
          'curl -fsS http://127.0.0.1:9000/health && curl -fsS http://127.0.0.1:9001/rustfs/console/health',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - dev-network
    profiles:
      - s3
      - full

  # ---------------------------------------------------------------------------
  # RustFS Init - Create the buckets listed in S3_BUCKETS (space separated)
  # Idempotent: existing buckets are left untouched. Uses the AWS CLI, so no
  # storage-vendor-specific tooling is required.
  # ---------------------------------------------------------------------------
  rustfs-init:
    image: amazon/aws-cli:latest
    container_name: dev_rustfs_init
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      AWS_EC2_METADATA_DISABLED: 'true'
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKETS: ${S3_BUCKETS:-dev}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -eu
        for bucket in $${S3_BUCKETS}; do
          if aws --endpoint-url "$${S3_ENDPOINT}" s3api head-bucket --bucket "$${bucket}" >/dev/null 2>&1; then
            echo "bucket already exists: $${bucket}"
          elif [ "$${AWS_DEFAULT_REGION}" = "us-east-1" ]; then
            aws --endpoint-url "$${S3_ENDPOINT}" s3api create-bucket --bucket "$${bucket}" >/dev/null
            echo "bucket created: $${bucket}"
          else
            aws --endpoint-url "$${S3_ENDPOINT}" s3api create-bucket --bucket "$${bucket}" \
              --create-bucket-configuration "LocationConstraint=$${AWS_DEFAULT_REGION}" >/dev/null
            echo "bucket created: $${bucket}"
          fi
        done
        echo "bucket initialization complete"
    restart: 'no'
    networks:
      - dev-network
    profiles:
      - s3
      - full

# =============================================================================
# Networks
# =============================================================================
networks:
  dev-network:
    driver: bridge
# =============================================================================
# Note: Using bind mounts (./data/*) for persistence in workspace
# Add ./data to .gitignore to avoid committing data files
# =============================================================================
